<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FOMO Desk">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>FOMO Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="offlineBar" hidden>The desk is not reachable. Telegram still gets live pushes. Pages can lag about 10 minutes.</div>
<div id="app">
  <header class="top">
    <div>
      <div class="brand">FOMO Desk <span id="modeBadge" class="badge">PAPER</span></div>
      <div id="updatedAt" class="muted">Loading…</div>
    </div>
    <div id="liveDot" class="dot">connecting</div>
  </header>
  <main id="screen"></main>
  <nav id="tabs">
    <button data-tab="home" class="on">Home</button>
    <button data-tab="agents">Agents</button>
    <button data-tab="activity">Activity</button>
    <button data-tab="account">Account</button>
  </nav>
</div>
<div id="toast" hidden></div>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
